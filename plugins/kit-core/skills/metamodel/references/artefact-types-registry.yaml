# artefact-types-registry.yaml — structural registry of every artefact type the kit mints.
#
# GENERATED PROJECTION (future — clew ADR-0008 Phase 4).
# Canonical owner: the clew repo (docs/metamodel/ -> metamodel.yaml).
# Do NOT author new artefact types here first; author clew-side, then sync.
# Until `clew metamodel export` ships, this file is the interim hand-authored
# projection sanctioned by clew ADR-0008 Phase 2 (kit ADR-0007 §4).
#
# Schema (one entry per artefact type):
#   type                 snake_case stable key (row identity, audit lookup)
#   okf_type             Title-Case display name emitted verbatim into `type:` frontmatter
#   minting_skill        the skill that produces the type
#   id_format            business-ID regex; null when the type mints no ID
#   layout               single-collection | one-per-artefact | inherits-from-parent
#   parent               set only when layout is inherits-from-parent
#   default_path         canonical output location template; null when inherited
#   review_interval      staleness cadence
#   frontmatter_conditionals  per-type fields beyond the universal supersedes/superseded_by; [] when none
#   property_schema_ref  property-model reference (TBD until clew defines it)
#
# Maintenance coupling: new/changed row -> this file + the metamodel skill's Audit mode type enum;
# semantics -> minting SKILL.md `## Canonical definition`; build order/ER -> SKILL.md spine
# + references/metamodel-reference.md.
#
# NOT carried by this projection: file-binding + content-hash rules (clew ADR-0017 D2 —
# child-bound sections excluded from the parent's hash) are clew-runtime facts; the kit
# projection stays purely structural.
# RULING (for OI-0078's implementer): the future `package` field will carry the clew
# metamodel package slug (discovery, business-architecture, domain, product-specs,
# planning, architecture, quality-assurance, operations) — NOT a TOGAF layer; layers are
# clew-side documentation framing over packages.


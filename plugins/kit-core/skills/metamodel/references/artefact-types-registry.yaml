# Canonical slugs — the third first-class identifier (stable + readable + short) carried by
# L0 capability domains, L1 capabilities, and products. Consumed by tooling (commit scopes
# via gen-commit-scopes.py, anchors, config keys). Enforced by Audit mode (Check 19).
slug_contract:
  applies_to:
    - concept: l0_capability_domain
      business_id: "C-N"
      canonical_home: docs/business/03a-capability-map.md
      placement: "code-line under the `## CN · Name` heading"
    - concept: l1_capability
      business_id: "C-N.M"
      canonical_home: docs/business/03a-capability-map.md
      placement: "code-line under the `### CN.M · Name` heading"
    - concept: product
      business_id: null   # FBS root / PBS layer
      canonical_home: docs/product-specs/07a-fbs.md
      placement: "code-line under the H1; and under each `## CN · Product` L0 section for a product-family FBS"
  line_format: "`slug: <handle>`"
  parser_regex: "^\\s*`slug:\\s*([a-z0-9]+(?:-[a-z0-9]+)*)`\\s*$"
  invariants:
    - "kebab-case, recommended <= 20 chars; no leading/trailing/double hyphens"
    - "globally unique across one flat namespace (L0 + L1 + product slugs together); sole sanctioned repeat: the same product in BC Map L0 and FBS L0 carries the byte-identical slug"
    - "mandatory for every L0 domain, L1 capability, and product; minting skill auto-proposes slugify(display-name)"
    - "stable: renaming is an ID-rename — propagate to all consumers and record in the artefact changelog"


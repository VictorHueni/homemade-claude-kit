# ─────────────────────────────────────────────
# Slide Builder - Project Configuration
# ─────────────────────────────────────────────
# This file drives the build (stitch) and split operations.
# Edit the slides list to match your deck.

# Presentation metadata (injected into <title> and <meta>)
title: "Presentation Title"
author: "Author"
date_label: ""

# Document language (<html lang>) — e.g. "en", "fr"
lang: "en"

# Dark: "light" (default) or "dark". dark makes every slide, or every page of a
# document, dark on the design's dark roles. For one dark slide, put `dark` on that
# partial's root instead: <div class="slide s-example dark">.
# theme: dark

# Data classification, printed at the right of every footer before the number, in
# this deck's lang (en, fr, de, it; English otherwise): Public, Internal,
# Confidential or Strictly confidential (sensitive personal data). Omit for none.
# classification: Internal

# Output shape: "slides" (fixed 16:9 canvas, presentation mode) or "document"
# (paginated A4/Letter, flowing partials, running header + page numbers in the PDF).
mode: slides

# Slide canvas (px), slides mode only. It comes from the design's slide-frame module
# (--slide-width, --slide-height; 960x540 in the kit's base theme). Set it here only
# to give this one deck another size; build.py and render.py then both use it.
# canvas:
#   width: 1280
#   height: 720

# Page geometry — document mode only. build.py turns this into the @page rule and
# render.py passes the same values to Chromium, so the two can never disagree.
# page:
#   size: A4                    # A4 | A5 | A3 | Letter | Legal
#   orientation: portrait       # portrait | landscape
#   margin: { top: 18mm, right: 18mm, bottom: 20mm, left: 18mm }
#   running_header: "{title}"   # placeholders: {title} {author} {date_label} {date}
#   footer_left: "{author} · {date_label}"
#   numbering: true             # "n / total" in the footer, from Chromium

# Design checks. build.py refuses a literal colour or a custom property outside the
# contract; a deliberate local value is declared here as NAME: VALUE and listed in
# the provenance report. A NAME that is a custom property may also be declared and
# used by the deck; a NAME that is a contract role replaces it in the contrast check.
# design:
#   exceptions:
#     cover-red: "#c8102e"

# External scripts loaded before slides render
external_scripts: []
#  - "https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"

# Ordered list of partial files (relative to slides_dir). In document mode each
# partial is a flowing <section class="doc-section"> (new page by default).
slides: []
#  - file: "00-title.html"
#    class: "s1"
#    label: "Title"

# Paths (relative to this config file)
paths:
  slides_dir:        "output/slides"
  styles_file:       "design/styles.css"
  script_file:       "design/script.js"
  bibliography_file: "context/bibliography.yaml"
  output_dir:        "output/slide-deck"
  output_filename:   "presentation.html"
  # Design system: a folder with a kit-manifest.json (for previewing an unreleased
  # design). Omit it to use the docs/ux/package.json pin found by walking up from
  # this deck, else the kit's base theme. A single token file such as
  # docs/ux/tokens.css is refused: run `ux-design-system point` or `subset`.
  # design_tokens:   "../../../design-system"

# Slide numbering
numbering:
  enabled: true
  format: "{current} / {total}"

name: delivery-comms

on:
  pull_request:
    branches: [main, release/2.0]
    paths:
      - 'plugins/delivery-comms/**'
      - '.github/workflows/delivery-comms.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: make -C plugins/delivery-comms test

  test-pdf:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # playwright is pinned to the version the goldens were captured with: a newer Chromium changes
      # user-agent defaults (a table's border colour from 1.64) and the computed-style goldens with them
      - run: pip install pyyaml playwright==1.60.0 pypdfium2==5.9.0
      - run: python -m playwright install --with-deps chromium
      - run: make -C plugins/delivery-comms test-pdf

  test-design-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pyyaml
      - run: make -C plugins/delivery-comms test-design-md
